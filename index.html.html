<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolución de la Canasta Alimentaria 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-bs: #38bdf8;
      --accent-usd: #34d399;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
    }

    .header {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .header h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }

    .header p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .stat-card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-card .value {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .stat-card.bs .value {
      color: var(--accent-bs);
    }

    .stat-card.usd .value {
      color: var(--accent-usd);
    }

    .stat-card .subtext {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 350px;
    }

    .footer {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 0.75rem;
    }

    @media (max-width: 480px) {
      .container {
        padding: 1rem;
      }
      .chart-container {
        height: 280px;
      }
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Evolución de la Canasta Alimentaria (2026)</h2>
      <p>Comportamiento mensual en Bolívares (Bs.) y Dólares (US$)</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card bs">
        <span class="label">Costo en Bolívares (Jul)</span>
        <span class="value">Bs. 516.804</span>
        <span class="subtext">▲ +116,7% acumulado 2026</span>
      </div>
      <div class="stat-card usd">
        <span class="label">Costo en Dólares (Jul)</span>
        <span class="value">$727,89</span>
        <span class="subtext">▲ +18,9% acumulado 2026</span>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="canastaChart"></canvas>
    </div>

    <div class="footer">
      <span>Fuente: Cendas-FVM</span>
      <span>Actualizado: Julio 2026</span>
    </div>
  </div>

  <script>
    const labels = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio'];
    const dataBs = [238450, 262100, 308084, 350685, 406000, 446305, 516804];
    const dataUsd = [612.10, 645.60, 692.32, 730.59, 773.00, 756.45, 727.89];

    const ctx = document.getElementById('canastaChart').getContext('2d');

    const canastaChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Costo en Bolívares (Bs.)',
            data: dataBs,
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.1)',
            borderWidth: 3,
            pointBackgroundColor: '#38bdf8',
            pointRadius: 4,
            pointHoverRadius: 6,
            tension: 0.3,
            fill: true,
            yAxisID: 'yBs'
          },
          {
            label: 'Costo en Dólares (US$)',
            data: dataUsd,
            borderColor: '#34d399',
            backgroundColor: 'rgba(52, 211, 153, 0.1)',
            borderWidth: 3,
            pointBackgroundColor: '#34d399',
            pointRadius: 4,
            pointHoverRadius: 6,
            tension: 0.3,
            fill: true,
            yAxisID: 'yUsd'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'index',
          intersect: false,
        },
        plugins: {
          legend: {
            position: 'top',
            labels: {
              color: '#f8fafc',
              font: {
                size: 12,
                weight: '500'
              },
              usePointStyle: true,
              padding: 20
            }
          },
          tooltip: {
            backgroundColor: '#0f172a',
            titleColor: '#f8fafc',
            bodyColor: '#cbd5e1',
            borderColor: '#334155',
            borderWidth: 1,
            padding: 12,
            boxPadding: 6,
            callbacks: {
              label: function(context) {
                let label = context.dataset.label || '';
                if (label) {
                  label += ': ';
                }
                if (context.datasetIndex === 0) {
                  label += 'Bs. ' + context.parsed.y.toLocaleString('es-VE', { minimumFractionDigits: 2 });
                } else {
                  label += '$' + context.parsed.y.toLocaleString('en-US', { minimumFractionDigits: 2 });
                }
                return label;
              }
            }
          }
        },
        scales: {
          x: {
            grid: {
              color: 'rgba(51, 65, 85, 0.5)',
              drawBorder: false
            },
            ticks: {
              color: '#94a3b8'
            }
          },
          yBs: {
            type: 'linear',
            display: true,
            position: 'left',
            title: {
              display: true,
              text: 'Bolívares (Bs.)',
              color: '#38bdf8',
              font: { size: 11, weight: '600' }
            },
            grid: {
              color: 'rgba(51, 65, 85, 0.5)',
              drawBorder: false
            },
            ticks: {
              color: '#94a3b8',
              callback: function(value) {
                return 'Bs. ' + (value / 1000).toFixed(0) + 'k';
              }
            }
          },
          yUsd: {
            type: 'linear',
            display: true,
            position: 'right',
            title: {
              display: true,
              text: 'Dólares (US$)',
              color: '#34d399',
              font: { size: 11, weight: '600' }
            },
            grid: {
              drawOnChartArea: false,
              drawBorder: false
            },
            ticks: {
              color: '#94a3b8',
              callback: function(value) {
                return '$' + value;
              }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
